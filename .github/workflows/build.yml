name: Build and Release libvless.so

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Download Go dependencies
        run: |
          go get github.com/xtls/xray-core@main
          go mod tidy

      - name: Patch anet zoneCache bug
        run: |
          ANET_DIR=$(go env GOPATH)/pkg/mod/github.com/wlynxg/anet*
          chmod -R +w $ANET_DIR || true
          find $ANET_DIR -name "*.go" -exec sed -i '/net\.zoneCache/d' {} + || true

      - name: Compile libvless.so (arm64-v8a)
        run: |
          export TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android26-clang
          
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
          go build -trimpath \
            -ldflags="-s -w -extldflags '-Wl,-soname,libvless.so'" \
            -buildmode=c-shared \
            -o libvless.so main.go

      - name: Generate release tag
        id: tag
        run: echo "release_tag=v$(date +'%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: Release ${{ steps.tag.outputs.release_tag }}
          make_latest: true
          draft: false
          prerelease: false
          files: libvless.so
