name: Build libvless.so

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Download Go dependencies
        run: |
          go get github.com/xtls/xray-core@v26.9.9 || go get github.com/xtls/xray-core@main
          go mod tidy

      - name: Compile libvless.so (arm64-v8a)
        run: |
          export TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android26-clang
          
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
          go build -trimpath -ldflags="-s -w" -buildmode=c-shared -o libvless.so main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvless-arm64
          path: libvless.so
